name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 3

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, vet
        run: |
          test -z "$(gofmt -l cmd internal tools web/embed.go)" || { gofmt -l cmd internal tools; exit 1; }
          go vet ./...
          go vet -tags integration ./...
      - name: Unit tests (race detector)
        run: go test -race ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start the test Asterisk
        run: |
          docker compose -f test/docker-compose.yml up -d --build
          for i in $(seq 1 30); do docker exec webphone-test-pbx asterisk -rx 'core show uptime' >/dev/null 2>&1 && break; sleep 2; done
      - name: SIP engine and full-stack tests against Asterisk
        run: go test -race -tags integration -count=1 ./internal/...
      - name: Asterisk log on failure
        if: failure()
        run: docker logs webphone-test-pbx | tail -200

  browser:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Start Asterisk and the server
        run: |
          docker compose -f test/docker-compose.yml up -d --build
          go build -o webphone ./cmd/webphone
          mkdir -p data out
          WEBPHONE_DATA_DIR=$PWD/data WEBPHONE_HTTPS_LISTEN=127.0.0.1:28443 WEBPHONE_SETUP_TOKEN=CITE-STTO-KENA-BCDE-FGHJ \
            nohup ./webphone > server.log 2>&1 &
          sleep 3
      - name: Firefox end-to-end test (two users call each other through Asterisk)
        run: |
          docker run --rm --network host -v $PWD:/repo -v $PWD/out:/out mcr.microsoft.com/playwright/python:v1.55.0-noble bash -c \
            "apt-get update -qq && apt-get install -y -qq pulseaudio >/dev/null && pulseaudio -D --exit-idle-time=-1 && sleep 2 && \
             pactl load-module module-null-sink sink_name=null && pip install -q playwright==1.55.0 && \
             python /repo/tools/browser_test.py --url https://127.0.0.1:28443 --token CITE-STTO-KENA-BCDE-FGHJ --out /out"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test
          path: |
            out
            server.log
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      - name: Unit tests, lint, debug and minified builds
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleE2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ip-phone-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
