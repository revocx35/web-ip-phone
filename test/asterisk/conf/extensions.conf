[general]
static = yes
writeprotect = yes

[default]
; extensions ring their registered contacts
exten => _200X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 600: echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 601: 1004 Hz test tone for 20 s, then hang up
exten => 601,1,Answer()
 same => n,Milliwatt(m)
 same => n,Hangup()

; 602: collect 4 DTMF digits and store them in AstDB test/dtmf-<caller>
exten => 602,1,Answer()
 same => n,Wait(0.5)
 same => n,Read(DIGITS,,4,,,15)
 same => n,Set(DB(test/dtmf-${CALLERID(num)})=${DIGITS})
 same => n,Wait(1)
 same => n,Hangup()

; 603: ring 2 s, then busy
exten => 603,1,Ringing()
 same => n,Wait(2)
 same => n,Busy(5)

; 604: early media (progress tones) then answer after 3 s, then tone
exten => 604,1,Progress()
 same => n,Playtones(425/1000,0/4000)
 same => n,Wait(3)
 same => n,StopPlaytones()
 same => n,Answer()
 same => n,Milliwatt(m)

; 605: answer and hang up after 3 s (remote BYE)
exten => 605,1,Answer()
 same => n,Wait(3)
 same => n,Hangup()

; 606: answer and put us on music on hold
exten => 606,1,Answer()
 same => n,MusicOnHold(default,20)
 same => n,Hangup()

; 699: never answers (ringing forever) - cancel tests
exten => 699,1,Ringing()
 same => n,Wait(120)
