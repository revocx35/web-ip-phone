; Test PBX: listens on 5160 (UDP+TCP) so it can share the host with the app (5070).
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5160

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5160

[endpoint-tpl](!)
type = endpoint
context = default
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[aor-tpl](!)
type = aor
max_contacts = 3
remove_existing = no
qualify_frequency = 30

[auth-tpl](!)
type = auth
auth_type = userpass

; 2001..2004 password Test-2001-pw etc.
[2001](endpoint-tpl)
auth = 2001
aors = 2001
callerid = "Alice" <2001>
[2001](aor-tpl)
[2001](auth-tpl)
username = 2001
password = Test-2001-pw

[2002](endpoint-tpl)
auth = 2002
aors = 2002
callerid = "Bob" <2002>
[2002](aor-tpl)
[2002](auth-tpl)
username = 2002
password = Test-2002-pw

[2003](endpoint-tpl)
auth = 2003
aors = 2003
callerid = "Carol" <2003>
allow = !ulaw,alaw
[2003](aor-tpl)
[2003](auth-tpl)
username = 2003
password = Test-2003-pw

; 2004 uses SIP INFO for DTMF
[2004](endpoint-tpl)
auth = 2004
aors = 2004
dtmf_mode = info
callerid = "Dave" <2004>
[2004](aor-tpl)
[2004](auth-tpl)
username = 2004
password = Test-2004-pw
